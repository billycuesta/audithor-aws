name: Collection regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in audithor_project/static/js/collection.js audithor_project/static/js/app.js audithor_project/static/js/views/{08_inspector,09_acm,11_databases}.js; do
            node --input-type=module --check < "$file"
          done
