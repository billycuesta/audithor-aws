name: Collection regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          find audithor/static/js -name '*.js' -print | while IFS= read -r file; do
            node --input-type=module --check < "$file" || exit 1
          done
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - name: Build and smoke-test installed package
        run: |
          set -euo pipefail
          python -m build --wheel --sdist --outdir /tmp/dist
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install /tmp/dist/*.whl
          cd /tmp
          /tmp/venv/bin/python -c "import audithor; print(audithor.__version__)"
          AUDITHOR_PORT=5099 BROWSER=true /tmp/venv/bin/python -m audithor &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 15); do
            if curl -fs http://127.0.0.1:5099/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:5099/static/vendor/tailwind-3.4.17.js | grep -qx 200
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:5099/static/js/app.js | grep -qx 200
