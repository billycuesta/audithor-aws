name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build, verify, and checksum distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          VERSION="${GITHUB_REF_NAME#v}"
          python - "$VERSION" <<'PY'
          import pathlib, re, sys
          source = pathlib.Path("audithor/__init__.py").read_text()
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)', source, re.M)
          if not match or match.group(1) != sys.argv[1]:
              actual = match.group(1) if match else "not found"
              raise SystemExit(f"Tag version {sys.argv[1]} does not match audithor version {actual}")
          PY
          python -m build --wheel --sdist --outdir dist
          python -m venv /tmp/audithor-release-venv
          /tmp/audithor-release-venv/bin/pip install dist/*.whl
          cd /tmp
          OUTPUT="$(/tmp/audithor-release-venv/bin/audithor --version)"
          test "$OUTPUT" = "audithor $VERSION"
          /tmp/audithor-release-venv/bin/audithor --no-browser --port 5099 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5099/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          curl -fsS http://127.0.0.1:5099/ -o /dev/null
          curl -fsS http://127.0.0.1:5099/static/vendor/tailwind-3.4.17.js -o /dev/null
          curl -fsS http://127.0.0.1:5099/static/js/app.js -o /dev/null
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
